# ==============================================================================
# Nginx Reverse Proxy Configuration for cricket.tvtoday.com.np
# Place in /etc/nginx/sites-available/cricket.tvtoday.com.np
# Symlink to /etc/nginx/sites-enabled/ and reload nginx
# ==============================================================================

server {
    listen 80;
    server_name cricket.tvtoday.com.np;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name cricket.tvtoday.com.np;

    # SSL Configuration (Certbot paths)
    ssl_certificate /etc/letsencrypt/live/cricket.tvtoday.com.np/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cricket.tvtoday.com.np/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 25M;

    # Next.js Application & Clean Broadcast Output
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Real-Time Broadcast Graphics WebSocket Server
    location /ws {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
