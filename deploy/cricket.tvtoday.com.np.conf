# ==============================================================================
# Nginx Configuration for cricket.tvtoday.com.np
# Ready for Certbot: sudo certbot --nginx -d cricket.tvtoday.com.np
#
# Place file at: /etc/nginx/sites-available/cricket.tvtoday.com.np
# Symlink to   : /etc/nginx/sites-enabled/cricket.tvtoday.com.np
# ==============================================================================

server {
    listen 80;
    server_name cricket.tvtoday.com.np;

    client_max_body_size 25M;

    # Next.js Web Application & API (Port 3211)
    location / {
        proxy_pass http://127.0.0.1:3211;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Real-Time Broadcast Graphics WebSocket Server (Port 3212)
    location /ws {
        proxy_pass http://127.0.0.1:3212;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
