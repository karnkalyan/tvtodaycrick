# ==============================================================================
# TV Today NPL Cricket Management System — Production Docker Compose
# Production URL: https://cricket.tvtoday.com.np
# Connected to existing running MySQL database container (almari-mysql)
# ==============================================================================

services:
  # TV Today Cricket Application (Next.js 16 + WebSocket Broadcast Engine)
  cricket-app:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: tvtoday-cricket-app
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      NODE_ENV: production
      PORT: 3211
      WS_PORT: 3212
      # Connect to existing running almari-mysql container on almari-network (port 3306)
      DATABASE_URL: "mysql://admin:quantumSql%40123@almari-mysql:3306/cricket_db"
      NEXT_PUBLIC_APP_NAME: "TV Today NPL Cricket Management"
      NEXT_PUBLIC_SITE_URL: "https://cricket.tvtoday.com.np"
      NEXT_PUBLIC_WS_URL: "wss://cricket.tvtoday.com.np/ws"
      # Seed all franchises, teams, rosters, and 32 scheduled fixtures
      SEED_DATABASE: "true"
      # Strictly false for production: no pre-set / mock match scores; ready for real match scoring and live sync
      SEED_MATCH_SCORES: "false"
      UPLOAD_MAX_MB: "25"
    ports:
      - "3211:3211"
      - "3212:3212"
    volumes:
      - cricket_uploads:/app/public/uploads
    networks:
      - almari-network

volumes:
  cricket_uploads:
    driver: local

# Connect to existing running network without recreating duplicate images or DBs
networks:
  almari-network:
    name: almari_almari-network
    external: true
